name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      replace_release:
        description: Replace the existing GitHub release for this exact tag after tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # Ubuntu runs an additional native lifecycle suite.
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 45 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install and test with the SDK-matched OMP release
        run: bun run test:baseline
      - name: Test with stock OMP 18
        run: bash scripts/test-omp.sh v18.22.2
      - name: Test the earlier OMP 18 native lifecycle
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/test-omp.sh v18.20.3
      - name: Package committed source
        run: bun run release
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: >-
      github.ref_type == 'tag' &&
      ((github.event_name == 'push' && !github.event.forced) ||
       (github.event_name == 'workflow_dispatch' && inputs.replace_release))
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_release }}
        run: |
          if [[ "$REPLACE_RELEASE" == true ]]; then
            bun run release --replace
          else
            bun run release --publish
          fi

  npm:
    name: Publish npm package
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Download and verify the released npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          filename="$name-$version.tgz"
          mkdir -p dist
          cd dist
          gh release download "$GITHUB_REF_NAME" --pattern "$filename" --pattern "$filename.sha256"
          sha256sum --check --strict "$filename.sha256"
      - name: Publish with npm Trusted Publishing
        run: |
          filename=$(node -p 'const {name, version} = require("./package.json"); `${name}-${version}.tgz`')
          npm publish "./dist/$filename" --access public --ignore-scripts
