[env]
# Linux uses the bundled feature. On macOS, skip Homebrew's pkg-config
# metadata and let the Apple SDK resolve the dynamic sqlite3 library.
LIBSQLITE3_SYS_USE_PKG_CONFIG = { value = "0", force = true }
SQLITE3_NO_PKG_CONFIG = { value = "1", force = true }
SQLITE3_STATIC = { value = "0", force = true }
